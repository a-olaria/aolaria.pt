<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manifesto — A Olaria</title>
    <style>
      :root { color-scheme: light; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f6f1e8;
        color: #29251f;
        font-family: Georgia, "Times New Roman", serif;
      }
      main { max-width: 42rem; padding: 2rem; text-align: center; }
      h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 400; }
      p { font-family: system-ui, sans-serif; font-size: 1.05rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Estamos a cozinhar.</h1>
      <p>Esta página está ainda a ser desenvolvida.</p>
    </main>
  </body>
