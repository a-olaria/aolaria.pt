<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A Olaria</title>
    <style>
      @font-face {
        font-family: "A Olaria Text";
        src: url("assets/fonts/myanmar-mn-bold.ttf") format("truetype");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Futura Bold";
        src: url("assets/fonts/futura-bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      :root {
        color-scheme: light;
        /* Adjust this value to change the space between letters in “A OLARIA”. */
        --wordmark-letter-spacing: 0.05em;
      }
      body {
        min-height: 100vh;
        margin: 0;
        background: #f6f1e8;
        color: #21070b;
        font-family: "A Olaria Text", "Times Regular", "Times New Roman", Times, serif;
      }
      main {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 100vh;
        padding: clamp(1.5rem, 4vw, 3.5rem);
        text-align: center;
      }
      .rules {
        height: clamp(0.45rem, 0.9vw, 0.7rem);
      }
      .rules--top {
        border-top: clamp(0.65rem, 1.35vw, 1.1rem) solid currentColor;
        border-bottom: clamp(0.35rem, 0.7vw, 0.55rem) solid currentColor;
      }
      .rules--bottom {
        height: clamp(0.28rem, 0.55vw, 0.45rem);
        border-top: clamp(0.35rem, 0.7vw, 0.55rem) solid currentColor;
        border-bottom: clamp(0.65rem, 1.35vw, 1.1rem) solid currentColor;
      }
      .identity { margin: 0; }
      h1 {
        margin: 0;
        font-family: "Futura Bold", Futura, "Arial Black", Arial, sans-serif;
        font-size: clamp(3.25rem, 13vw, 11rem);
        font-weight: 700;
        letter-spacing: var(--wordmark-letter-spacing);
        line-height: 0.82;
        text-transform: uppercase;
      }
      .rules + h1 { margin-top: clamp(1.55rem, 3.4vw, 2.7rem); }
      h1 + .rules { margin-top: clamp(0.65rem, 1.4vw, 1.15rem); }
      ul {
        display: flex;
        justify-content: center;
        margin: clamp(1.6rem, 3vw, 2.5rem) 0 0;
        padding: 0;
        list-style: none;
      }
      a {
        color: inherit;
        font-size: 0.78rem;
        font-weight: 400;
        letter-spacing: 0.14em;
        text-decoration-thickness: 0.12em;
        text-underline-offset: 0.3em;
        text-transform: uppercase;
      }
      nav a { font-size: 0.95rem; }
      #como-contribuir { margin-top: clamp(3rem, 8vw, 6rem); }
      h2, p { margin: 0; }
      h2 {
        font-family: "Times Regular", "Times New Roman", Times, serif;
        font-size: 0.7rem;
        font-weight: 400;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #como-contribuir p { margin-top: 0.55rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="identity">
        <div class="rules rules--top" aria-hidden="true"></div>
        <h1>A Olaria</h1>
        <div class="rules rules--bottom" aria-hidden="true"></div>
        <nav aria-label="Navegação principal">
          <ul>
            <li><a href="/manifesto/">Manifesto</a></li>
          </ul>
        </nav>
      </div>
      <section id="como-contribuir">
        <h2>Para comentários e sugestões</h2>
        <p><a href="mailto:aolaria@sapo.pt">aolaria@sapo.pt</a></p>
      </section>
    </main>
  </body>
</html>
